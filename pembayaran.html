<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pembayaran — Tuyyi</title>
<meta name="description" content="Pembayaran ke TUYYISTORE, Service lewat QRIS, transfer bank, atau e-wallet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fugaz+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#101010;--soft:#171717;--border:#292929;--text:#fff;--muted:#9b9b9b;--strong:#fff;--on-strong:#000;--err:#ff8a8a;--r:20px;--s:16px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f6f6f6;--card:#fff;--soft:#f0f0f0;--border:#e0e0e0;--text:#0a0a0a;--muted:#666;--strong:#000;--on-strong:#fff;--err:#c62828;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
b{font-weight:700}
small{font-size:.8125rem}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem}
.brand{font-family:'Fugaz One',sans-serif;font-size:1.6rem;line-height:1.2;color:var(--text);text-decoration:none}
.tools{display:flex;align-items:center;gap:.75rem}
.sw{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;font-size:.875rem;user-select:none}
.sw input{-webkit-appearance:none;appearance:none;position:relative;margin:0;width:2.4rem;height:1.35rem;border-radius:99px;border:1px solid var(--border);background:var(--soft);cursor:pointer}
.sw input::after{content:"";position:absolute;top:50%;left:.18rem;width:.9rem;height:.9rem;border-radius:50%;background:var(--muted);transform:translateY(-50%);transition:transform .2s,background .2s}
.sw input:checked::after{transform:translate(1.05rem,-50%);background:var(--strong)}
.sw input:focus-visible,.icn:focus-visible,.btn:focus-visible,.chip:focus-visible,.mth:focus-visible,.cp:focus-visible,.menu a:focus-visible,.inp:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.icn{width:40px;height:40px;display:inline-grid;place-items:center;border:1px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer;font-size:1.2rem}
.ico{width:1em;height:1em;flex:none}
.menu{position:absolute;right:1rem;top:calc(100% + .4rem);width:min(260px,calc(100% - 2rem));padding:.4rem;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 18px 40px -20px rgba(0,0,0,.6)}
.menu a{display:flex;align-items:center;gap:.75rem;min-height:46px;padding:0 .8rem;border-radius:12px;color:var(--text);text-decoration:none;font-weight:500}
.menu a:hover,.menu a.on{background:var(--soft)}
.wrap{max-width:520px;margin:0 auto;padding:1rem 1rem 3rem;display:grid;gap:.875rem}
body[data-view="home"] .wrap{max-width:960px}
.wrap.anim>*{animation:in .22s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.wrap.anim>*{animation:none}*{transition-duration:.01ms!important}}
.hg{display:grid;gap:.875rem}.col{display:grid;gap:.875rem;align-content:start;min-width:0}
@media (min-width:900px){.hg{grid-template-columns:1fr 1fr;gap:1rem;align-items:start}}
.tb{display:flex;align-items:center;gap:.7rem;min-height:44px}
.tb h1{margin:0;font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem}
.lab{display:block;font-size:.8125rem;color:var(--muted)}
.rc .row,.ac .row,.sum .row{display:flex;align-items:center;gap:.75rem}
.rc .row{margin-top:.6rem}.rc small,.qinfo small{display:block;color:var(--muted)}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
.tags{display:flex;gap:.5rem;margin-top:.75rem}
.tag{display:inline-flex;align-items:center;gap:.45rem;padding:.25rem .65rem;border:1px solid var(--border);border-radius:99px;background:var(--soft);font-size:.75rem;color:var(--muted)}
.tag img{height:10px;filter:invert(1)}
:root[data-theme="light"] .tag img{filter:none}
.big{display:block;margin:.25rem 0 .75rem;font-size:2.25rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big.dim{opacity:.4}
.inp{width:100%;height:48px;padding:0 .9rem;border:1px solid var(--border);border-radius:var(--s);background:var(--soft)}
.chips,.mg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
.chips{margin-top:.75rem}
.chip{height:44px;border:1px solid var(--border);border-radius:12px;background:var(--soft);font-size:.78rem;font-weight:600;cursor:pointer}
.chip.on,.mth.on{background:var(--strong);color:var(--on-strong);border-color:var(--strong)}
.gl{margin:1rem 0 .5rem;font-size:.8125rem;color:var(--muted)}.gl:first-of-type{margin-top:.5rem}
.mth{display:grid;justify-items:center;align-content:start;gap:.35rem;min-height:92px;padding:.6rem .25rem;border:1px solid var(--border);border-radius:var(--s);background:var(--soft);font-size:.75rem;font-weight:500;cursor:pointer}
.mth:disabled{opacity:.45;cursor:not-allowed}
.mth.wide{grid-column:1/-1;display:flex;align-items:center;gap:.75rem;min-height:64px;padding:.6rem .8rem;text-align:left;font-size:.9375rem}
.mth.wide small{display:block;font-weight:400;opacity:.7}
.mth em{font-style:normal;font-size:.625rem;line-height:1.2;text-align:center;color:var(--muted)}
.lg{width:44px;height:44px;flex:none;display:grid;place-items:center;overflow:hidden;border-radius:14px}
.lg img{width:100%;height:100%;object-fit:cover}
.lg.pad{background:#fff;padding:6px}.lg.pad img{object-fit:contain}
.lg.wm{font-size:.72rem;font-weight:800;line-height:1.05;text-align:center}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:52px;padding:0 1.25rem;border:1px solid var(--strong);border-radius:var(--s);background:var(--strong);color:var(--on-strong);font-weight:700;text-decoration:none;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.99)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--border)}
.err{min-height:1.3em;margin:0;font-size:.875rem;color:var(--err)}
.note{margin:0;text-align:center;font-size:.8125rem;color:var(--muted)}.note a{color:var(--text)}
.info{display:flex;gap:.75rem;padding:.9rem 1rem;border:1px solid var(--border);border-radius:var(--s);background:var(--card);color:var(--muted);font-size:.8125rem}
.info p{margin:0}.info .ico{width:18px;height:18px;margin-top:2px}
.qhead{display:flex;align-items:center;gap:.75rem;margin-bottom:.9rem}.qhead small{display:block;color:var(--muted)}
.qbox{display:grid;place-items:center;padding:.5rem;border-radius:var(--s);background:#fff}.qbox img{display:block;width:100%;max-width:320px}
.qinfo{margin:.9rem 0;text-align:center}.qinfo b{display:block}
.steps{margin:.5rem 0 0;padding-left:1.25rem;color:var(--muted);font-size:.9rem}.steps li{padding:.2rem 0}
.ac{cursor:pointer;transition:border-color .2s}.ac.on{border-color:var(--strong)}.ac.off{opacity:.55;cursor:default}
.num{margin:.75rem 0;font-size:1.35rem;font-weight:600;letter-spacing:.03em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.num.none{font-size:.95rem;font-weight:500;letter-spacing:0;color:var(--muted)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding-top:.4rem;border-top:1px solid var(--border);color:var(--muted)}
.cp{color:var(--text);display:inline-flex;align-items:center;gap:.4rem;min-height:40px;padding:0;border:0;background:none;font-weight:600;cursor:pointer}
.cp:disabled{opacity:.4;cursor:not-allowed}
.pill{margin-left:auto;padding:.15rem .6rem;border-radius:99px;background:var(--strong);color:var(--on-strong);font-size:.6875rem;font-weight:700}
.sum hr{border:0;border-top:1px solid var(--border);margin:.9rem 0}
.sum .row{margin:.5rem 0 0}
#zoom{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.92);cursor:zoom-out;padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
#zoom img{max-width:100%;max-height:100%;border-radius:12px;background:#fff}
#toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;padding:.6rem 1rem;border-radius:99px;background:var(--strong);color:var(--on-strong);font-size:.875rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>

  <p class="err" id="err" role="alert"></p><button class="btn" type="button" data-act="confirm">Lanjut ke konfirmasi</button>`;
const vConf = () => { const m = cur() || {}; return `${recip(false)}
  <section class="card sum"><span class="lab">Metode pembayaran</span><div class="row">${m.name ? logo(m) : ''}<b>${m.name || '-'}</b></div><hr>
    <span class="lab">Nominal pembayaran</span><span class="big" style="margin-bottom:0">${rp(S.amt)}</span></section>
  <section class="card"><label class="lab" for="note" style="margin-bottom:.5rem">Keperluan (opsional)</label><input id="note" class="inp" placeholder="Contoh: top up saldo, jasa bot" value="${esc(S.note)}"></section>
  <div class="info">${ic('info')}<p>Lakukan pembayaran sesuai metode di atas. Setelah berhasil, kirim konfirmasi dan bukti bayar. Pembayaran dinyatakan selesai setelah dicek penjual.</p></div>
  <p class="err" id="err" role="alert"></p>
  <a class="btn" id="wa" href="#" target="_blank" rel="noopener" data-act="wa">${ic('chat')} Konfirmasi via WhatsApp</a>
  <a class="btn ghost" id="tg" href="https://t.me/${CFG.tg}" target="_blank" rel="noopener" data-act="tg">${ic('send')} Kirim via Telegram</a>
  <p class="note" id="sent" ${S.sent ? '' : 'hidden'}>Pesan konfirmasi dibuka. Status baru berubah setelah penjual mengecek pembayaran Anda.</p>`; };
const VIEWS = { home:vHome, qris:vQris, bank:() => vList('bank'), ewallet:() => vList('ewallet'), confirm:vConf };

function render(anim) {
  $('#app').classList.toggle('anim', !!anim);
  const back = S.view !== 'home';
  $('#app').innerHTML = `<div class="tb">${back ? `<button class="icn" type="button" data-act="back" aria-label="Kembali">${ic('back')}</button>` : ''}<h1>${TITLE[S.view]}</h1></div>${VIEWS[S.view]()}`;
  document.body.dataset.view = S.view;
  $$('#menu a[data-go]').forEach(a => a.classList.toggle('on', a.dataset.go === S.view));
}
function go(v) {
  const m = cur();
  if (v === 'qris') S.method = 'qris';
  if ((v === 'bank' || v === 'ewallet') && (!m || m.g !== v)) S.method = null;
  S.view = v; render(true); scrollTo(0, 0);
}
const syncAmt = () => {
  const i = $('#amt'); if (!i) return;
  i.value = fmt(S.amt); const d = $('#disp'); d.textContent = rp(S.amt); d.classList.toggle('dim', !+S.amt);
  $$('.chip').forEach(c => c.classList.toggle('on', +c.dataset.amt === +S.amt));
};

// Pesan konfirmasi: nominal, metode, dan keperluan bila diisi
const msg = () => ['Halo Tuyyi, saya ingin konfirmasi pembayaran.', 'Metode: ' + cur().name, 'Nominal: ' + rp(S.amt),
  ...(S.note.trim() ? ['Keperluan: ' + S.note.trim()] : []), 'Bukti bayar saya lampirkan di chat ini.'].join('\n');
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1800); };
const copyText = async t => {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) { try { const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(a); a.select(); const r = document.execCommand('copy'); a.remove(); return r; } catch (e2) { return false; } }
};

// Menu, tema
const NAV = [['home', 'Pembayaran', 'wallet'], ['qris', 'QRIS', 'qr'], ['bank', 'Transfer bank', 'bank'], ['ewallet', 'E-wallet', 'wallet']];
$('#menu').innerHTML = NAV.map(n => `<a href="#" data-go="${n[0]}">${ic(n[2])}${n[1]}</a>`).join('') + `<a href="https://wa.me/${CFG.wa}" target="_blank" rel="noopener">${ic('chat')}Bantuan WhatsApp</a>`;
const menu = o => { $('#menu').hidden = !o; $('#menuBtn').setAttribute('aria-expanded', o); $('#menuBtn').innerHTML = ic(o ? 'x' : 'list'); };
menu(false);
const setTheme = (dark, save) => {
  document.documentElement.dataset.theme = dark ? 'dark' : 'light'; $('#theme').checked = dark; $('#themeLbl').textContent = dark ? 'Dark' : 'Light';
  if (save) try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
};
let saved = null; try { saved = localStorage.getItem('theme'); } catch (e) {}
setTheme(saved !== 'light', false);
$('#theme').onchange = e => setTheme(e.target.checked, true);
$('#menuBtn').onclick = () => menu($('#menu').hidden);
addEventListener('keydown', e => { if (e.key === 'Escape') { menu(false); $('#zoom').hidden = true; } });

document.addEventListener('click', async ev => {
  const t = ev.target;
  if (!ev.composedPath().includes($('.top'))) menu(false);
  const g = t.closest('[data-go]');
  if (g) { ev.preventDefault(); menu(false); go(g.dataset.go); return; }
  const q = t.closest('[data-amt]');
  if (q) { S.amt = q.dataset.amt; syncAmt(); showErr(''); return; }
  const c = t.closest('[data-copy]');
  if (c && c.dataset.copy) {
    S.method = c.dataset.m; const r = await copyText(c.dataset.copy);
    toast(r ? 'Nomor disalin' : 'Gagal menyalin, salin manual');
    render(); const b = $(`.cp[data-m="${S.method}"]`); if (b && r) { b.textContent = 'Tersalin'; setTimeout(() => { if (b.isConnected) b.innerHTML = 'Salin ' + ic('copy'); }, 1800); }
    return;
  }
  const mt = t.closest('[data-m]');
  if (mt && !mt.disabled && mt.dataset.m) { S.method = mt.dataset.m; showErr(''); render(); return; }
  const a = t.closest('[data-act]'); if (!a) { if (t.closest('#zoom')) $('#zoom').hidden = true; return; }
  const act = a.dataset.act;
  if (act === 'back') go(S.view === 'confirm' ? (cur() ? cur().g : 'home') : 'home');
  else if (act === 'next') { const e = check(); if (e) showErr(e); else go(cur().g); }
  else if (act === 'confirm') { const e = check(); if (e) showErr(e); else { S.sent = false; go('confirm'); } }
  else if (act === 'zoom') { $('#zoom img').src = IMG.poster; $('#zoom').hidden = false; }
  else if (act === 'wa' || act === 'tg') {
    const e = check();
    if (e) { ev.preventDefault(); showErr(e); return; }
    if (act === 'wa') a.href = 'https://wa.me/' + CFG.wa + '?text=' + encodeURIComponent(msg());
    else { copyText(msg()); toast('Pesan disalin, tempel di Telegram'); }
    S.sent = true; $('#sent').hidden = false;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'amt') { const d = e.target.value.replace(/\D/g, '').slice(0, 10); S.amt = d ? String(Number(d)) : ''; syncAmt(); showErr(''); }
  if (e.target.id === 'note') S.note = e.target.value;
});
render(true);
</script>
</body>
</html>
